name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      branch:
        description: 'Branch to release from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
      skip_tests:
        description: 'Skip tests before release'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.9'

jobs:
  # Test before releasing - unified test suite
  test:
    name: Test Suite (Unit + Integration)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          make lint
          
      - name: Run formatting
        run: |
          make format
          
      - name: Run unit tests
        run: |
          mkdir -p tests/integration/test_reports
          make test-unit

      - name: Run integration tests
        env:
          API_KEY: ${{ secrets.LABELLERR_API_KEY }}
          API_SECRET: ${{ secrets.LABELLERR_API_SECRET }}
          CLIENT_ID: ${{ secrets.LABELLERR_CLIENT_ID }}
          TEST_EMAIL: ${{ secrets.LABELLERR_TEST_EMAIL }}
          AWS_CONNECTION_IMAGE: ${{ secrets.AWS_CONNECTION_IMAGE }}
          AWS_CONNECTION_VIDEO: ${{ secrets.AWS_CONNECTION_VIDEO }}
          GCS_CONNECTION_IMAGE: ${{ secrets.GCS_CONNECTION_IMAGE }}
          GCS_CONNECTION_VIDEO: ${{ secrets.GCS_CONNECTION_VIDEO }}
          LABELLERR_TEST_DATA_PATH: ${{ github.workspace }}/tests/fixtures/mcp_images
          IMAGE_DATASET_ID: ${{ vars.IMAGE_DATASET_ID }}
          AUDIO_MP3_DATASET_ID: ${{ vars.AUDIO_MP3_DATASET_ID }}
          AUDIO_WAV_DATASET_ID: ${{ vars.AUDIO_WAV_DATASET_ID }}
          VIDEO_DATASET_ID: ${{ vars.VIDEO_DATASET_ID }}
          DOCUMENT_DATASET_ID: ${{ vars.DOCUMENT_DATASET_ID }}
          TEXT_DATASET_ID: ${{ vars.TEXT_DATASET_ID }}
        run: |
          make test-integration

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-reports
          path: |
            tests/integration/test_reports/
            htmlcov/
          retention-days: 90

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: tests/integration/test_reports/junit.xml
          check_name: Release Test Results
          comment_title: Release Test Results

      - name: Test Report Summary
        if: always()
        run: |
          echo "## 📊 Release Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "### Integration Tests ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/integration/test_reports/junit.xml ]; then
            echo "✅ Test reports generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📄 Reports available in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No test reports found" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ticket: ${{ steps.ticket.outputs.ticket }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bump2version
        run: pip install bump2version

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Extract ticket from commit or branch
        id: ticket
        run: |
          # Extract LABIMP ticket from latest commit message or branch name
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          TICKET=$(echo "$COMMIT_MSG" | grep -oE 'LABIMP-[0-9]+' | head -1 || echo "")
          if [ -z "$TICKET" ]; then
            TICKET=$(echo "${{ github.head_ref || github.ref_name }}" | grep -oE 'LABIMP-[0-9]+' | head -1 || echo "RELEASE")
          fi
          echo "ticket=$TICKET" >> $GITHUB_OUTPUT
          echo "Found ticket: $TICKET"

      - name: Determine version bump type
        id: bump_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ inputs.version_type }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "current=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: version
        run: |
          BUMP_TYPE=${{ steps.bump_type.outputs.type }}

          # Create .bumpversion.cfg with LABIMP commit message format
          cat > .bumpversion.cfg << EOF
          [bumpversion]
          current_version = ${{ steps.current_version.outputs.current }}
          commit = True
          tag = True
          tag_name = v{new_version}
          message = [${{ steps.ticket.outputs.ticket }}] Bump version: {current_version} → {new_version}

          [bumpversion:file:pyproject.toml]
          search = version = "{current_version}"
          replace = version = "{new_version}"
          EOF

          # Bump the version
          bump2version --allow-dirty $BUMP_TYPE

          # Get the new version
          NEW_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push origin ${{ github.ref_name }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: '[${{ steps.ticket.outputs.ticket }}] Release ${{ steps.version.outputs.tag }}'
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
          generate_release_notes: true
          body: |
            ## [${{ steps.ticket.outputs.ticket }}] Changes in ${{ steps.version.outputs.tag }}

            ### What's Changed
            - Automated release from `${{ github.ref_name }}` branch
            - Version bumped from `${{ steps.current_version.outputs.current }}` to `${{ steps.version.outputs.version }}`

            ### Branch Strategy
            - **Main branch** releases are production-ready patches
            - **Develop branch** releases are pre-release minor versions for testing

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.release.outputs.version }}
          path: dist/*
          retention-days: 90

  notify:
    name: Notify Release Completion
    runs-on: ubuntu-latest
    needs: [release, build]
    if: always()

    steps:
      - name: Release Success
        if: needs.release.result == 'success' && needs.build.result == 'success'
        run: |
          echo "🎉 Release ${{ needs.release.outputs.version }} completed successfully!"
          echo "📦 Package built and artifacts uploaded"
          echo "🏷️ Git tag: ${{ needs.release.outputs.tag }}"
          echo "📋 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}"

      - name: Release Failed
        if: needs.release.result == 'failure' || needs.build.result == 'failure'
        run: |
          echo "❌ Release failed!"
          echo "Release job: ${{ needs.release.result }}"
          echo "Build job: ${{ needs.build.result }}"
          exit 1
