[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --html=report.html
    -ra
timeout = 300
timeout_method = thread
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require real API credentials
    slow: Tests that take a long time to run
    aws: Tests that require AWS credentials and services
    gcs: Tests that require Google Cloud Storage credentials and services
    skip_ci: Tests to skip in CI environment
    deprecated: Deprecated tests using old API (excluded from test runs)
    destructive: Tests that delete resources (can be excluded with 'not destructive')
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
console_output_style = progress
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
